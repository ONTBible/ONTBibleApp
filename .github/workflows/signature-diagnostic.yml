name: Signature — diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: macos-15
    steps:
      - name: Ce que la clé a le droit de voir
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Un environnement virtuel : le Python du runner est « externally
          # managed » (PEP 668) et refuse toute installation globale.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt

          jeton = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"],
               "exp": int(time.time()) + 600,
               "aud": "appstoreconnect-v1"},
              os.environ["ASC_PRIVATE_KEY"],
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )

          def interroger(chemin):
              requete = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/{chemin}",
                  headers={"Authorization": f"Bearer {jeton}"})
              try:
                  with urllib.request.urlopen(requete) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, json.load(e)

              # Trois questions, et elles se distinguent :
              #   403 → la clé n'a pas le rôle ; il faut une clé Admin.
              #   200 avec une liste vide → le rôle suffit, l'objet manque.

          for chemin, titre in [
              ("certificates?filter[certificateType]=DISTRIBUTION&limit=200",
               "certificats de distribution"),
              ("profiles?limit=200", "profils"),
              ("bundleIds?limit=200", "identifiants d'app"),
          ]:
              code, corps = interroger(chemin)
              print(f"\n═══ {titre} — HTTP {code} ═══")
              if code != 200:
                  for e in corps.get("errors", []):
                      print("  ", e.get("title"), "—", e.get("detail"))
                  continue
              elements = corps.get("data", [])
              print(f"   {len(elements)} trouvé(s)")
              for el in elements[:12]:
                  a = el.get("attributes", {})
                  print("   ·", a.get("name") or a.get("identifier"),
                        "│", a.get("certificateType") or a.get("profileType") or "",
                        "│", a.get("profileState") or a.get("expirationDate") or "")
          PY
