# Les tests, à chaque poussée et à chaque proposition.
#
# ## Il ne porte aucun secret, et c'est le point
#
# Ce workflow s'exécute sur du code qui n'est pas encore relu — une proposition
# venue d'un fork peut contenir n'importe quoi. Il ne reçoit donc **aucune**
# clé : ni App Store Connect, ni signature, ni jeton. Le pire qu'un code
# malveillant puisse y faire est de gâcher des minutes de calcul chez GitHub.
#
# Tout ce qui touche à Apple vit dans `testflight.yml`, qui ne se déclenche que
# sur `main` et sur les étiquettes — donc uniquement après fusion, donc après
# relecture.
#
# ## Pourquoi pas de runner sur la machine de l'auteur
#
# Un runner auto-hébergé exécuterait le code d'une proposition externe **sur son
# Mac**, avec ses clés de signature à portée. Le dépôt étant public, GitHub
# fournit des runners macOS gratuitement et sans limite : il n'y a aucune raison
# de prendre ce risque.

name: Tests

on:
  push:
    branches: [dev, staging, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-15
    # **Le seul workflow qui n'en avait pas**, et le plus cher : un runner
    # macOS est facturé au décuple d'un runner Linux.
    #
    # Le 21 août 2026, `xcodebuild test` s'est bloqué sur quatre runs lancés en
    # même temps. Ils ont tourné **deux heures** avant qu'on s'en aperçoive, et
    # sans intervention ils seraient allés jusqu'à la limite de six heures de
    # GitHub — vingt-quatre heures de runner macOS facturées, pour zéro signal.
    #
    # Le code n'y était pour rien : les mêmes commits, au fichier Markdown
    # près, avaient passé en treize minutes une heure plus tôt. C'était
    # transitoire. Ce qui manquait, c'était la borne.
    #
    # Trente minutes : plus du double du temps observé, assez pour absorber une
    # lenteur de runner, assez court pour qu'un blocage se voie dans l'heure.
    #
    # **Quarante depuis que le Mac est éprouvé ici aussi.** Le chiffre suit la
    # règle qu'énonce le paragraphe ci-dessus — le double du temps observé — et
    # non l'inverse : une seconde cible à bâtir allonge le run, et garder 30
    # aurait transformé la borne en couperet sur des builds sains.
    timeout-minutes: 40

    steps:
      - name: L'app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ONTBibleApp

      # Le vault. Le corpus n'est pas dans le dépôt — il est produit par le
      # pipeline — donc il faut sa source pour compiler quoi que ce soit.
      - name: Le vault
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ONTBible/ONTBibleTranslation
          path: ONTBibleTranslation

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest

      # Le journal doit dire avec quoi il a construit. Sans cette ligne, un
      # échec dû à une version d'Xcode se cherche à l'aveugle.
      - name: La version d'Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true

      # `xcbeautify` rend la sortie d'`xcodebuild` lisible et pose les
      # annotations d'erreur sur les lignes concernées dans l'interface de
      # GitHub. Sans lui, une erreur de compilation se cherche dans dix mille
      # lignes de journal.
      - name: Les outils
        run: brew install xcodegen xcbeautify

      # Le script fait les trois : le pipeline lit le vault et produit `dist/`,
      # le recopie dans les ressources de l'app, et `xcodegen` engendre le
      # projet — qui n'est pas committé, parce qu'un `.xcodeproj` dans un dépôt
      # est une source de conflits sans contrepartie.
      #
      # Plus aucune étape Node : le pipeline est un binaire depuis le portage
      # en Rust. Ce qui demandait `setup-node` puis `npm ci` — donc un runtime
      # et un arbre de dépendances — demande maintenant la chaîne Rust, déjà
      # présente sur le runner pour le backend.
      - name: Le corpus et le projet
        working-directory: ONTBibleApp
        env:
          ONT_VAULT: ${{ github.workspace }}/ONTBibleTranslation
        run: ./scripts/corpus.sh

      - name: Le pipeline
        working-directory: ONTBibleApp/pipeline
        # Mêmes exigences que le backend, et pour la même raison : c'est lui
        # qui décide de ce que le lecteur voit. `--all-targets` couvre les
        # tests eux-mêmes — un test qui ne compile plus ne protège plus rien.
        #
        # Et les deux jeux de fonctionnalités sont éprouvés : le site prend la
        # caisse en `--no-default-features`, et un `#[cfg]` mal placé ne se
        # verrait que chez lui, à la compilation du déploiement.
        run: |
          set -o pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo check --no-default-features
          cargo test

      - name: Le backend
        working-directory: ONTBibleApp/backend
        # Le backend n'était pas éprouvé du tout. Il pouvait casser sans
        # qu'aucune fusion ne soit bloquée — et c'est lui qui porte
        # l'effacement des comptes et la consommation des jetons.
        #
        # `--all-targets` couvre aussi les tests eux-mêmes : un test qui ne
        # compile plus est un test qui ne protège plus rien.
        run: |
          set -o pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Les tests des paquets — ils ne tournaient **pas**.
      #
      # Le schéma Xcode ne teste que `ONTTests`, la cible de l'app. Les cibles
      # de test des paquets locaux n'y sont pas, donc `xcodebuild test` les
      # ignorait : les 15 tests d'`ONTKit` — routeur, recherche, arbre inline —
      # n'ont jamais été exécutés, ni ici ni sur une machine de développement.
      # Ils passaient pour une protection, sans en être une.
      #
      # `swift test` les lance là où ils vivent. Sur macOS et non en simulateur,
      # ce qui est légitime : ces deux paquets ne touchent ni UIKit ni SwiftUI.
      - name: Les tests des paquets
        working-directory: ONTBibleApp/app/Packages
        run: |
          set -o pipefail
          for paquet in ONTKit ONTData; do
            echo "── $paquet ──"
            (cd "$paquet" && swift test)
          done

      # Un simulateur nommé est un pari sur l'image du runner.
      #
      # Le commentaire d'à côté promettait déjà « un simulateur générique
      # plutôt qu'un modèle nommé », et le code nommait pourtant un modèle. Le
      # jour où GitHub a livré un Xcode sans aucun appareil préinstallé — que
      # des emplacements —, la promesse s'est révélée n'être qu'une intention.
      #
      # On cherche donc ce qui existe, et on le crée s'il n'existe rien. Le
      # test ne dépend plus de ce qu'un tiers a bien voulu préinstaller.
      - name: Un simulateur, trouvé ou créé
        id: simulateur
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json, subprocess

          def simctl(*args):
              return json.loads(subprocess.run(
                  ["xcrun", "simctl", *args, "--json"],
                  capture_output=True, text=True, check=True).stdout)

          def version(nom):
              # « iOS 26.1 » → (26, 1), pour comparer des versions et non des
              # chaînes : sans ça, « iOS 9 » passerait après « iOS 26 ».
              chiffres = [int(n) for n in nom.replace("-", ".").split(".") if n.isdigit()]
              return tuple(chiffres) or (0,)

          # Ce qui est déjà là.
          par_execution = simctl("list", "devices", "available")["devices"]
          candidats = []
          for execution, appareils in par_execution.items():
              if "iOS" not in execution:
                  continue
              for a in appareils:
                  if a.get("isAvailable") and "iPhone" in a["name"]:
                      candidats.append((version(execution), a["udid"]))
          if candidats:
              print(max(candidats)[1])
              raise SystemExit

          # Rien : on en fabrique un. Le modèle le plus récent, sur l'exécution
          # la plus récente.
          executions = [r for r in simctl("list", "runtimes")["runtimes"]
                        if r.get("isAvailable") and "iOS" in r["name"]]
          if not executions:
              raise SystemExit("Aucune exécution iOS sur ce runner.")
          execution = max(executions, key=lambda r: version(r["version"]))

          modeles = [t for t in simctl("list", "devicetypes")["devicetypes"]
                     if "iPhone" in t["name"]]
          if not modeles:
              raise SystemExit("Aucun modèle d'iPhone sur ce runner.")
          modele = max(modeles, key=lambda t: version(t["name"]))

          print(subprocess.run(
              ["xcrun", "simctl", "create", "ONT-CI",
               modele["identifier"], execution["identifier"]],
              capture_output=True, text=True, check=True).stdout.strip())
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -F "$UDID" || true

      - name: Les tests de l'app
        working-directory: ONTBibleApp/app
        run: |
          set -o pipefail
          xcodebuild test \
            -project ONT.xcodeproj \
            -scheme ONT \
            -destination "id=${{ steps.simulateur.outputs.udid }}" \
            -resultBundlePath ../resultats.xcresult \
            | xcbeautify --renderer github-actions

      # **La liseuse du Mac n'était éprouvée nulle part.**
      #
      # `-scheme ONT` ne bâtit que la cible iOS. Les épreuves de `MacTests/` —
      # dont `EchelleDeLInterfaceTests`, qui établit que `dynamicTypeSize` est
      # inerte sur macOS et que le texte sans fonte déclarée suit bien le
      # facteur d'interface — ne tournaient que sur la machine de la session
      # qui les avait écrites. Un commit iOS pouvait casser le Mac en vert.
      #
      # Ce sont précisément les constats qui ont coûté le plus cher à établir :
      # trois relevés pour comprendre que l'ancien levier était mort. Les
      # laisser hors CI, c'était accepter de les réapprendre.
      #
      # Pas de simulateur ici : la destination est le runner lui-même.
      #
      # **Sans icône, et ce n'est pas un goût.** `ASSETCATALOG_COMPILER_APPICON_NAME`
      # est vidé parce que l'`actool` d'Xcode 26.3 — celui du runner — **plante**
      # en composant le bundle Icon Composer pour macOS. Pas une erreur de
      # validation : un plantage, `IBAbstractPlatformToolProxy` et une attente de
      # rapport de crash, sans un mot sur ce qu'il reproche. La même icône passe
      # pour iOS dans le job d'à côté, et pour macOS sous l'Xcode 27 de la
      # machine de développement.
      #
      # Une app d'épreuve n'a que faire d'une icône : on la retire ici plutôt
      # que de retenir tout le job sur un outil qui tombe. **Mais la limite est
      # réelle** — le jour où le Mac se livre, le runner de livraison devra
      # tourner sur un Xcode dont l'`actool` ne plante pas, sans quoi la fiche
      # partirait grise. C'est écrit ici pour que ce ne se découvre pas ce
      # jour-là.
      #
      # **Sans signature, et c'est une limite qu'il faut connaître.** Le runner
      # n'a pas de compte développeur, donc pas de profil, donc rien à signer
      # avec. Les droits d'`ONTMac.entitlements` sont alors absents du binaire :
      # ce job dit que le code du Mac tient, il ne dira **jamais** que Sign in
      # with Apple fonctionne. Cette vérification-là se fait à la main, sur une
      # machine enregistrée dans le compte développeur.
      - name: Les tests du Mac
        working-directory: ONTBibleApp/app
        run: |
          set -o pipefail
          xcodebuild test \
            -project ONT.xcodeproj \
            -scheme ONTMac \
            -destination "platform=macOS" \
            -resultBundlePath ../resultats-mac.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ../brut-mac.log | xcbeautify --renderer github-actions

      # **Ce que `xcbeautify` avale.**
      #
      # Il rend la sortie lisible en ne gardant que ce qu'il sait nommer. Les
      # diagnostics d'`actool` n'en font pas partie : au premier passage de ce
      # job, la compilation de l'icône a échoué et le compte rendu ne portait
      # que « Command CompileAssetCatalogVariant failed with a nonzero exit
      # code » — l'échec sans sa raison, donc un aller-retour de CI pour
      # apprendre ce que la première exécution savait déjà.
      #
      # On garde le brut à côté et on n'en montre les lignes d'erreur que
      # lorsqu'il y en a. Rien ne s'ajoute au journal d'un run vert.
      - name: Ce que le Mac a vraiment dit
        if: failure()
        working-directory: ONTBibleApp
        run: |
          # **D'abord les épreuves, quand il y en a.**
          #
          # Un échec qui ne nomme pas l'attente déçue protège sans rien
          # apprendre : le suivant doit refaire l'enquête depuis zéro. Le job
          # iOS rend « Expectation failed » et le nom du test ; celui-ci ne
          # rendait qu'`exit 65`.
          echo "── les épreuves qui ont échoué ──"
          if [ -d resultats-mac.xcresult ] \
            && xcrun xcresulttool get test-results summary \
                 --path resultats-mac.xcresult > resume-mac.json 2>/dev/null; then
            python3 scripts/lire-echecs.py resume-mac.json
          else
            echo "  aucun paquet de résultats : les épreuves n'ont pas été atteintes"
          fi

          # **Puis le brut, pour ce qui tombe avant elles.**
          #
          # C'est ce qui est arrivé au premier passage : `actool` plantait, et
          # `xcbeautify` ne rendait que « failed with a nonzero exit code ».
          echo
          echo "── les lignes d'erreur du log brut ──"
          grep -iE "error:|failed|\*\* [A-Z]+ FAILED" brut-mac.log | tail -40 || true
          echo
          echo "── tout ce qui touche à l'icône ──"
          grep -iE "actool|icon|IBAbstract|CompileAssetCatalog" brut-mac.log | tail -60 || true

      # Le compte réel, lu des paquets de résultats. La ligne « Executed 0 tests »
      # d'`xcodebuild` ne compte que l'ancien XCTest : Swift Testing y est
      # invisible, et l'on croirait qu'aucun test n'a tourné.
      #
      # Chaque paquet est compté séparément, et son absence est dite plutôt que
      # levée : quand l'iPhone tombe, le Mac n'a pas tourné et son paquet
      # n'existe pas. Une erreur de plus ici masquerait celle qu'on cherche.
      - name: Le compte
        if: always()
        working-directory: ONTBibleApp
        run: |
          compter() {
            if [ ! -d "$1.xcresult" ]; then
              echo "$2 — pas de résultats : les épreuves n'ont pas tourné"
              return
            fi
            xcrun xcresulttool get test-results summary --path "$1.xcresult" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(f\"$2 — {d['passedTests']} réussis / {d['totalTestCount']}\")"
          }
          compter resultats "l'iPhone"
          compter resultats-mac "le Mac"
