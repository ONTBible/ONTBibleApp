# Déploie le backend quand `main` bouge.
#
# ## Ce qu'il fait, et ce qu'il ne fait **pas**
#
# Il éprouve, construit, remplace le code de la Lambda, et vérifie que l'API
# répond. Il ne touche **jamais** à Terraform.
#
# C'est délibéré, et c'est le même partage que pour le site : l'état de
# Terraform vit en local, pas dans un dépôt distant. Un job qui l'exécuterait
# travaillerait sans savoir ce qui existe déjà — il recréerait tout, ou
# détruirait ce qu'il ne connaît pas. La forme de l'infrastructure reste une
# décision prise à la main ; la CI ne fait que livrer.
#
# `backend/terraform/main.tf` le dit de son côté : `ignore_changes` sur le code
# de la Lambda. Sans cette ligne, un `apply` lancé d'un poste remettrait en
# production le zip qui traîne dans le dossier local.
#
# ## Aucune clé
#
# L'authentification passe par OIDC : GitHub signe un jeton qui dit d'où vient
# ce job, AWS le vérifie et prête `ont-api-github` pour la durée du job. Rien
# n'est stocké dans les secrets du dépôt, donc rien ne fuit et rien n'est à
# révoquer.
#
# Ce rôle ne peut que remplacer le code de `ont-api`. Il ne lit pas la table
# DynamoDB — où vivent les surlignages, donnée de l'article 9 — et ne touche pas
# aux variables d'environnement, où vit le secret des jetons.
#
# ## Pourquoi ce workflow n'existait pas
#
# Le backend était éprouvé par `tests.yml` et déployé **à la main**, par
# `scripts/deployer-backend.sh` lancé depuis un poste. Ça marche tant que la
# personne qui le fait s'en souvient. Ça veut dire aussi qu'un correctif fusionné
# pouvait rester des semaines sur `main` sans être en ligne — et que personne ne
# pouvait le savoir en regardant le dépôt.
#
# ## Il porte les trois étapes du script, pas seulement la construction
#
# Une première version de ce fichier faisait un simple
# `cargo lambda build --output-format zip`. Elle aurait marché, et elle aurait
# **dégradé la production en silence** : binaire 11 Mo plus lourd sur chaque
# démarrage à froid, et surtout aucune symbolication — les paniques seraient
# arrivées dans Sentry en adresses hexadécimales, sans que rien ne le signale
# jusqu'à la première panne qu'on aurait cherché à lire.
#
# Construire complet, envoyer les symboles, déployer une copie dépouillée : les
# trois vont ensemble. Le script reste la voie du poste — il est le seul à
# pouvoir appliquer Terraform — mais les deux chemins font désormais la même
# chose au binaire.

name: Déployer le backend

on:
  push:
    branches: [main]
    # Le backend seul. L'app iOS, le pipeline et le vault ont leurs propres
    # chaînes ; les faire tous partir à chaque commit serait du bruit et des
    # minutes.
    paths:
      - "backend/**"
      - ".github/workflows/deployer-backend.yml"
  # Pour redéployer sans commit — après un `terraform apply`, par exemple.
  workflow_dispatch:

# Le jeton OIDC, et rien de plus. `contents: read` suffit à cloner.
permissions:
  id-token: write
  contents: read

# Deux déploiements simultanés remplaceraient le code dans le désordre. Le
# second attend ; il n'annule pas le premier, qui a peut-être déjà écrit.
concurrency:
  group: deployer-backend
  cancel-in-progress: false

env:
  # **La chaîne Rust est épinglée, et ce n'est pas de la prudence en l'air.**
  #
  # Le 21 août 2026, ce déploiement a cassé sans qu'une ligne ait été poussée :
  # `rustup toolchain install stable` a ramené 1.98.0, dont le linker passe
  # `--fix-cortex-a53-843419` que `cargo-zigbuild` ne sait pas filtrer. Ni Zig
  # ni `cargo-zigbuild` n'avaient bougé — seule la chaîne s'était mise à jour
  # toute seule.
  #
  # `ONTBibleWebapp/.github/workflows/deployer.yml` porte la **même** épingle,
  # pour la même raison et à la même version. Les deux doivent bouger ensemble.
  #
  # **Quand la remonter :** dès que `cargo-zigbuild` sait filtrer cet argument.
  # Essayer une version, laisser un déploiement tourner, garder si c'est vert.
  VERSION_RUST: "1.97.1"
  REGION: eu-west-3
  FONCTION: ont-api
  # L'adresse stable, indépendante de l'identifiant `execute-api` qu'AWS change
  # si l'API est recréée.
  API: https://api.ontbible.com

jobs:
  deployer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install "$VERSION_RUST" --profile minimal
          rustup default "$VERSION_RUST"
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Les tests d'abord, et ils sont la seule chose entre un commit et la
      # production. Vingt et un tests, sans réseau ni AWS — ils portent
      # l'effacement des comptes et la consommation des jetons de
      # rafraîchissement, c'est-à-dire ce qu'on ne veut pas casser en silence.
      - name: Les tests
        working-directory: backend
        run: cargo test --all-targets

      - name: Zig
        # cargo-lambda ne compile pas lui-même vers Amazon Linux : il délègue
        # l'édition de liens à zig, qui sait viser une version précise de la
        # glibc. Un binaire lié à celle d'Ubuntu (2.39) référencerait des
        # symboles absents d'Amazon Linux 2023 (2.34), et la fonction refuserait
        # de démarrer — sans autre message qu'un `Runtime.InvalidEntrypoint`.
        run: pip3 install ziglang

      - name: cargo-lambda
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-lambda

      - name: sentry-cli et llvm-objcopy
        # `llvm-objcopy` et non `objcopy` : le binaire vise aarch64, et
        # l'`objcopy` de GNU installé sur un runner x86 ne saurait pas le lire.
        # Celui de LLVM est indifférent à la cible.
        run: |
          set -euo pipefail
          curl -sL https://sentry.io/get-cli/ | sh
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm
          command -v llvm-objcopy || ls /usr/lib/llvm-*/bin/llvm-objcopy

      # Construit **complet**, avec sa table des symboles.
      #
      # C'est ce que fait `scripts/deployer-backend.sh`, et pour une raison
      # qu'il faut connaître avant de « simplifier » ces trois étapes en une :
      # un binaire Rust dépouillé ne dit plus le nom de ses fonctions, donc une
      # panique arriverait dans Sentry en adresses hexadécimales. Mais garder le
      # binaire bavard coûte 11 Mo sur chaque démarrage à froid — 24,3 Mo contre
      # 13,2 — et l'éditeur de liens de cargo-lambda n'offre aucun
      # intermédiaire : `strip = "debuginfo"` dépouille autant que `strip = true`.
      #
      # La sortie est de faire les deux : construire complet, envoyer les
      # symboles, déployer une copie dépouillée. Sentry symbolise côté serveur.
      - name: Le binaire, symboles compris
        working-directory: backend
        run: cargo lambda build --release --arm64

      - name: Les symboles partent chez Sentry
        working-directory: backend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pinkha-app
          SENTRY_PROJECT: ont-api
        run: |
          sentry-cli debug-files upload --include-sources --force-foreground \
            target/lambda/ont-backend/bootstrap

      # Le dépouillement, et le contrôle qui le rend sûr.
      #
      # L'identifiant de débogage est dérivé du **code machine**, pas de la
      # table des symboles : il survit donc au dépouillement, et c'est lui qui
      # apparie le binaire déployé aux symboles qu'on vient d'envoyer. Si les
      # deux divergeaient un jour, Sentry ne pourrait plus rien symboliser — et
      # ça ne se verrait qu'à la première panique, c'est-à-dire au pire moment.
      # On préfère ne pas déployer.
      - name: La copie dépouillée
        working-directory: backend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pinkha-app
          SENTRY_PROJECT: ont-api
        run: |
          set -euo pipefail
          cible=target/lambda/ont-backend
          objcopy=$(command -v llvm-objcopy || ls /usr/lib/llvm-*/bin/llvm-objcopy | head -1)

          # La sortie est capturée entière avant d'être filtrée : un
          # `awk … exit` ferme le tuyau, et sentry-cli panique sur l'écriture
          # suivante au lieu de répondre.
          identifiant() {
            local sortie
            sortie="$(sentry-cli debug-files check "$1")"
            # `$NF` et non `$3` : la ligne est « > Debug ID: <uuid> ».
            printf '%s\n' "$sortie" | grep -m1 'Debug ID:' | awk '{print $NF}'
          }

          avant="$(identifiant "$cible/bootstrap")"
          cp "$cible/bootstrap" "$cible/bootstrap.strip"
          "$objcopy" --strip-all "$cible/bootstrap.strip"
          apres="$(identifiant "$cible/bootstrap.strip")"

          if [ "$avant" != "$apres" ]; then
            echo "::error::L'identifiant de débogage a changé au dépouillement."
            echo "::error::complet $avant / dépouillé $apres — Sentry ne pourrait rien apparier."
            exit 1
          fi
          echo "identifiant inchangé ($avant), $(du -h "$cible/bootstrap.strip" | cut -f1)"

          # `bootstrap` est le nom attendu par le runtime Lambda, et le bit
          # exécutable doit survivre à l'archivage : la copie dépouillée entre
          # sous ce nom-là, depuis un répertoire à part pour ne pas piétiner le
          # binaire complet.
          boite=$(mktemp -d)
          cp "$cible/bootstrap.strip" "$boite/bootstrap"
          chmod +x "$boite/bootstrap"
          ( cd "$boite" && zip -q -9 bootstrap.zip bootstrap )
          mv "$boite/bootstrap.zip" "$cible/bootstrap.zip"

      - name: AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::274399924176:role/ont-api-github
          aws-region: ${{ env.REGION }}

      - name: Le code
        working-directory: backend
        run: |
          aws lambda update-function-code --function-name "$FONCTION" \
            --zip-file "fileb://target/lambda/ont-backend/bootstrap.zip" \
            --query 'LastModified' --output text
          aws lambda wait function-updated --function-name "$FONCTION"

      # Le déploiement n'est pas fini quand la commande rend la main, il est
      # fini quand l'API répond. Sans cette vérification, un binaire qui ne
      # démarre pas passerait pour un succès — et c'est exactement la panne que
      # zig évite plus haut, celle qui ne dit rien.
      #
      # `/health` seulement : les autres routes demandent une session, et un job
      # de CI n'a pas à en fabriquer une pour se rassurer.
      - name: Vérifier
        run: |
          sleep 5
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$API/health")
          printf '%-24s %s\n' "/health" "$code"
          [ "$code" = "200" ] || exit 1
