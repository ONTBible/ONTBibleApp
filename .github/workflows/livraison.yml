# La livraison, sur deux canaux.
#
# ## Une branche, une destination
#
# | branche | ce qui se passe | qui le voit |
# |---|---|---|
# | `dev` | le build monte ; le groupe **interne** le reçoit de lui-même | soi, et les siens |
# | `staging` | le build monte, rejoint le groupe **externe**, passe sa revue de bêta | les testeurs invités |
# | `main` | le build monte et part à la **revue de l'App Store** | le public |
#
# Une branche nomme donc un **destinataire**, pas une manœuvre. Ce qu'on
# fusionne dans `dev` ne sort pas de chez soi ; ce qu'on promeut dans `staging`
# s'expose à des tiers ; ce qui atteint `main` s'expose à tous. La chaîne de
# promotion — `dev` → `staging` → `main` — est tenue par `branch-policy.yml` :
# on ne saute pas un palier.
#
# ## Pourquoi le rattachement au groupe est une étape à part
#
# Téléverser un build le rend disponible aux testeurs **internes**, et à eux
# seuls. Un groupe externe — celui dont on partage le lien public — ne reçoit
# rien tant que le build ne lui est pas explicitement rattaché **et** qu'il n'a
# pas passé la revue de bêta d'Apple. C'est ce qui faisait afficher
# « No Compatible Build » sur un groupe pourtant nourri de builds.
#
# ## Le numéro de version ne vient pas d'ici
#
# `CFBundleVersion` — le numéro de build — est **daté** : `AAMMJJ.hhmm` en temps
# universel. Il croît donc tout seul, se lit d'un coup d'œil, et ne dépend
# d'aucun compteur.
#
# Il l'a d'abord été de `github.run_number`, ce qui semblait plus simple. Ce
# compteur appartient au **fichier** de workflow : renommer celui-ci l'a remis à
# un, alors que les builds en ligne allaient jusqu'à vingt et un. Apple exige un
# numéro qui monte ; un compteur qu'un renommage réinitialise ne peut pas le
# garantir. `CFBundleShortVersionString` — la version
# publique — reste celui de l'`Info.plist`, parce que c'est lui qui doit
# correspondre à la version préparée dans App Store Connect. Le monter est donc
# un geste de dépôt, visible dans la revue de code qui mène à `main`.
#
# ## Il porte les clés, donc il ne tourne jamais sur du code non relu
#
# Ni `pull_request`, ni `pull_request_target` : uniquement `push` sur les trois
# branches de livraison. Le code qui s'exécute ici a donc déjà été fusionné,
# donc relu. Les tests, eux, tournent sans aucun secret — voir `tests.yml`.
#
# ## Aucun certificat à gérer
#
# La signature passe par une **clé d'API App Store Connect** et
# `-allowProvisioningUpdates` : Xcode demande à Apple le certificat et le profil
# dont il a besoin, les installe pour la durée du job, et les oublie. Pas de
# trousseau à déverrouiller, pas de `.p12` en base 64 dans un secret, pas de
# profil à renouveler tous les ans à la main.
#
# ## Les secrets à poser
#
# Dans *Settings → Secrets and variables → Actions* du dépôt :
#
# | secret | où le trouver |
# |---|---|
# | `ASC_KEY_ID` | App Store Connect → Intégrations → Clés d'API, colonne « ID de clé » |
# | `ASC_ISSUER_ID` | même page, en haut — un seul pour tout le compte |
# | `ASC_PRIVATE_KEY` | le contenu du `.p8`, téléchargeable **une seule fois** |
# | `ASC_CONTACT_EMAIL` | le contact que la revue App Store exige |
# | `ASC_CONTACT_TELEPHONE` | au format international — Apple refuse le reste |
#
# La clé doit avoir le rôle **App Manager** : « Developer » ne suffit pas à
# envoyer un build.

name: Livraison

on:
  push:
    branches: [dev, beta-test, app-store]
    # **Ce qui ne peut pas changer le binaire ne déclenche pas de livraison.**
    #
    # Un correctif de CI poussé dans `main` faisait partir un build **et une
    # soumission à l'App Store** — pendant qu'une revue était en cours. Le
    # 21 août 2026, l'épingle de la chaîne Rust du backend a dû traverser
    # `dev → staging → main` pour atteindre le déploiement, et rien ne
    # distinguait ce trajet d'une vraie livraison.
    #
    # `paths-ignore` ne saute que si **tous** les fichiers touchés y sont : un
    # changement mêlé à du code d'app livre toujours. Et `workflow_dispatch`
    # reste là pour éprouver un changement de ce fichier même seul.
    paths-ignore:
      - ".github/workflows/**"
      - "backend/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      canal:
        description: "Où livrer"
        type: choice
        options: [interne, beta, appstore]
        default: interne

permissions:
  contents: read

# Deux envois simultanés se disputeraient le même numéro de build. Le second
# attend ; il n'annule pas le premier, qui a peut-être déjà téléversé.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  livrer:
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      build: ${{ steps.numeros.outputs.build }}
      canal: ${{ steps.numeros.outputs.canal }}
      groupe: ${{ steps.numeros.outputs.groupe }}

    steps:
      - name: L'app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ONTBibleApp

      - name: Le vault
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ONTBible/ONTBibleTranslation
          path: ONTBibleTranslation

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest

      # Le journal doit dire avec quoi il a construit. Sans cette ligne, un
      # échec dû à une version d'Xcode se cherche à l'aveugle.
      - name: La version d'Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true

      - name: Les outils
        run: brew install xcodegen xcbeautify

      # Le numéro de build vient du compteur d'exécutions du workflow.
      #
      # Il doit être **strictement croissant** : App Store Connect refuse un
      # build dont le numéro a déjà servi, et le refus arrive après le
      # téléversement, quand la compilation est déjà payée. `run_number` ne
      # redescend jamais, même si l'on force-pousse.
      #
      # La version, elle, vient de l'étiquette quand il y en a une — `v1.2.0`
      # donne `1.2.0`. Sans étiquette, on garde celle du `project.yml` : un
      # build de TestFlight n'a pas à inventer un numéro de version.
      - name: Le numéro, le canal et le groupe
        id: numeros
        run: |
          # Daté plutôt que compté : rien à conserver d'une exécution à
          # l'autre, et l'ordre est garanti par le temps lui-même.
          echo "build=$(date -u +%y%m%d).$(date -u +%H%M)" >> "$GITHUB_OUTPUT"
          # Le nom du groupe est celui d'App Store Connect. Le script le
          # cherche par ce nom plutôt que par un identifiant : un identifiant
          # dans un fichier de CI ne se relit pas, et devient faux le jour où
          # le groupe est recréé.
          case "${{ github.ref }}" in
            refs/heads/app-store) CANAL=appstore; GROUPE= ;;
            refs/heads/beta-test) CANAL=beta;     GROUPE=Beta ;;
            refs/heads/dev)     CANAL=interne;  GROUPE=Dev ;;
            *)
              CANAL="${{ inputs.canal || 'interne' }}"
              case "$CANAL" in
                appstore) GROUPE= ;;
                beta)     GROUPE=Beta ;;
                *)        GROUPE=Dev ;;
              esac
              ;;
          esac
          echo "canal=$CANAL" >> "$GITHUB_OUTPUT"
          echo "groupe=$GROUPE" >> "$GITHUB_OUTPUT"
          echo "Canal : $CANAL${GROUPE:+ — groupe « $GROUPE »}"

      - name: Le corpus et le projet
        working-directory: ONTBibleApp
        env:
          ONT_VAULT: ${{ github.workspace }}/ONTBibleTranslation
        # Un binaire, plus aucun runtime : voir `scripts/corpus.sh`.
        run: ./scripts/corpus.sh

      # **Un build livré doit pouvoir dater son corpus, ou ne pas partir.**
      #
      # `CorpusUpdater` n'accepte du corpus publié que ce qu'il peut prouver
      # plus récent que le sien. Sans estampille embarquée, `estampilleEmbarquee`
      # rend `nil`, la garde refuse tout, et **l'app ne met plus jamais son
      # corpus à jour** — sans rien dire, ce qui est précisément le silence que
      # cette garde existe pour empêcher, retourné contre elle.
      #
      # `corpus.sh` se contente d'avertir : c'est le bon choix en local, où
      # l'on construit souvent sans vault. Une livraison, elle, doit refuser —
      # un avertissement qu'un build ignore est une déclaration sans la chose,
      # et le défaut ne se verrait qu'à l'exécution, chez un testeur, des jours
      # plus tard.
      #
      # ## Ce que cette garde n'est pas
      #
      # La session du vault a signalé un défaut : `ONT_GENERE` absente des
      # workflows, donc un binaire livré qui ne se mettrait jamais à jour. Elle
      # s'est rétractée, et j'avais mesuré la même chose de mon côté : la
      # variable **est** posée, par `corpus.sh`, que ces workflows appellent.
      # Son `git grep` cherchait où la variable serait déclarée, pas où le
      # travail se fait.
      #
      # La garde reste, pour une autre raison que celle qu'on m'avait donnée :
      # **`corpus.sh` avertit et continue.** C'est le bon choix en local, où
      # l'on construit souvent sans vault. Mais un avertissement qu'une
      # livraison ignore ne garde rien — et celle-ci partirait avec un
      # actualiseur gelé à vie, sans que rien ne le dise avant qu'un testeur
      # s'étonne, des jours plus tard, de ne rien recevoir.
      #
      # Éprouvée dans les deux sens : code 1 sans estampille, code 0 avec.
      - name: Le corpus est-il datable
        working-directory: ONTBibleApp
        run: |
          set -euo pipefail
          genere=$(python3 -c "import json;print(json.load(open('dist/manifest.json')).get('generatedAt',''))")
          if [ -z "$genere" ]; then
            echo "✗ dist/manifest.json ne porte pas de generatedAt." >&2
            echo "  L'app livrée ne mettrait jamais son corpus à jour, en silence." >&2
            echo "  Vérifier que le vault est bien présent et que ONT_VAULT le désigne." >&2
            exit 1
          fi
          echo "→ corpus datable — $genere"

      # Les numéros sont posés **après** `xcodegen`, directement dans les
      # `Info.plist` produits. Les mettre dans `project.yml` obligerait à
      # committer un numéro de build à chaque livraison — un commit qui ne dit
      # rien, et qui redéclencherait le workflow.
      - name: Poser le numéro de build
        working-directory: ONTBibleApp/app
        run: |
          for plist in Info.plist Widget/Info.plist; do
            [ -f "$plist" ] || continue
            plutil -replace CFBundleVersion -string "${{ steps.numeros.outputs.build }}" "$plist"
          done
          plutil -p Info.plist | grep -E "CFBundleVersion|CFBundleShortVersionString"

      - name: La clé App Store Connect
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: sentry-cli
        # La phase de build « Symboles de débogage → Sentry » échoue si l'outil
        # manque, et c'est voulu — voir `scripts/televerser-symboles.sh`.
        #
        # Par l'installeur officiel plutôt que par brew : sur un runner macOS,
        # `brew install` met plusieurs minutes là où celui-ci prend quelques
        # secondes, pour le même binaire.
        run: curl -sSf https://sentry.io/get-cli/ | sh

      # Les certificats que la livraison précédente a laissés derrière elle.
      #
      # ## Pourquoi il en naît un à chaque fois
      #
      # `xcodebuild archive -allowProvisioningUpdates` a besoin d'une identité
      # de signature. Le runner est neuf : son trousseau est vide. Xcode crée
      # donc une clé privée **sur la machine**, enregistre le certificat
      # correspondant chez Apple par l'API — d'où son nom, « Created via
      # API » — puis le runner est détruit à la fin du job.
      #
      # La clé privée meurt avec lui. Le certificat, lui, reste enregistré, et
      # personne ne pourra plus jamais s'en servir : il n'existe aucune copie
      # de sa clé. C'est un déchet, par construction.
      #
      # Apple plafonne le nombre de certificats d'un compte. Au vingtième, la
      # création échoue et l'archive s'arrête sur « Your account has reached
      # the maximum number of certificates » — un message qui ne dit ni d'où
      # ils viennent, ni qu'ils sont tous inutiles. C'est arrivé au build 19,
      # après dix-huit livraisons.
      #
      # ## Pourquoi c'est sans danger
      #
      # Le filtre est double, et volontairement étroit : type `DEVELOPMENT`
      # **et** nom exactement « Apple Development: Created via API ». Les
      # certificats d'une personne portent son nom — `Apple Development: Yannis
      # Bikouta`, `Apple Distribution: Yannis Bikouta` — et ne sont donc jamais
      # touchés. Ceux de distribution non plus : ils servent à un autre projet,
      # et les révoquer casserait ses livraisons.
      #
      # La concurrence de ce workflow est sérialisée (`group: testflight`), donc
      # aucune autre livraison ne peut être en train d'utiliser celui qu'on
      # révoque.
      #
      # ## Pourquoi avant et non après
      #
      # Après, un job interrompu — annulation, panne du runner, dépassement de
      # temps — laisserait son déchet sans jamais le ramasser, et le plafond
      # reviendrait. Avant, le ménage est fait même si la fois d'avant s'est
      # mal terminée : l'état stable est **un** certificat, celui de la
      # livraison en cours.
      - name: Ramasser les certificats orphelins
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # PEP 668 : le Python du runner refuse une installation globale.
          python3 -m venv "$RUNNER_TEMP/venv-certs"
          "$RUNNER_TEMP/venv-certs/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv-certs/bin/python" - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          import jwt

          JETABLE = "Apple Development: Created via API"

          jeton = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"],
               "exp": int(time.time()) + 600,
               "aud": "appstoreconnect-v1"},
              os.environ["ASC_PRIVATE_KEY"],
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )
          entetes = {"Authorization": f"Bearer {jeton}"}
          racine = "https://api.appstoreconnect.apple.com/v1"

          requete = urllib.request.Request(
              f"{racine}/certificates?filter[certificateType]=DEVELOPMENT&limit=200",
              headers=entetes)
          try:
              with urllib.request.urlopen(requete) as r:
                  corps = json.load(r)
          except urllib.error.HTTPError as e:
              # On n'arrête pas la livraison pour un ménage : le plafond n'est
              # peut-être pas atteint, et l'archive dira elle-même s'il l'est.
              print(f"::warning::lecture des certificats impossible (HTTP {e.code}) — on continue")
              sys.exit(0)

          orphelins = [c for c in corps.get("data", [])
                       if c.get("attributes", {}).get("name") == JETABLE]
          gardes = len(corps.get("data", [])) - len(orphelins)
          print(f"{len(orphelins)} orphelin(s) à révoquer, {gardes} certificat(s) nominatif(s) gardé(s)")

          for certificat in orphelins:
              identifiant = certificat["id"]
              suppression = urllib.request.Request(
                  f"{racine}/certificates/{identifiant}", headers=entetes, method="DELETE")
              try:
                  urllib.request.urlopen(suppression)
                  print(f"  révoqué {identifiant}")
              except urllib.error.HTTPError as e:
                  print(f"::warning::  {identifiant} non révoqué (HTTP {e.code})")
          PY

      - name: L'archive
        working-directory: ONTBibleApp/app
        env:
          # Absent tant que le secret n'existe pas : la phase avertit alors et
          # laisse passer, puisque les dSYM sont conservés en artefact juste
          # après et qu'Apple les reçoit déjà par `uploadSymbols`.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ONT.xcodeproj \
            -scheme ONT \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ONT.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            | xcbeautify --renderer github-actions

      # Les dSYM sont gardés quoi qu'il arrive. C'est ce qui permet à la phase
      # Sentry de n'être qu'un avertissement quand le jeton manque : les
      # symboles de **ce build précis** restent récupérables, et un
      # `sentry-cli debug-files upload` les enverra plus tard. Sans cet
      # artefact, un build livré sans eux serait illisible pour toujours.
      - name: Garder les symboles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsym-${{ github.sha }}
          path: ${{ runner.temp }}/ONT.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 90

      # `destination: upload` téléverse depuis `exportArchive`, sans passer par
      # `altool` — qui est déprécié — ni par fastlane, qui ajouterait Ruby et
      # ses dépendances pour faire la même chose.
      - name: L'export et l'envoi
        working-directory: ONTBibleApp/app
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <!-- Les symboles partent avec le build : sans eux, une pile
                 d'appels de crash reste illisible dans Xcode Organizer. -->
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ONT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            | xcbeautify --renderer github-actions

      # Apple traite le build après réception — vérification, indexation des
      # symboles. Ça prend de cinq à trente minutes, et il n'est pas
      # distribuable avant. On n'attend pas ici : le job rendrait la main une
      # demi-heure plus tard pour rien.
      - name: Ce qui suit
        run: |
          echo "### Build ${{ steps.numeros.outputs.build }} envoyé" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple le traite en 5 à 30 minutes." >> "$GITHUB_STEP_SUMMARY"
          case "${{ steps.numeros.outputs.canal }}" in
            appstore) echo "Il sera ensuite soumis à la revue de l'App Store." >> "$GITHUB_STEP_SUMMARY" ;;
            *)        echo "Il rejoindra ensuite le groupe « ${{ steps.numeros.outputs.groupe }} »." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  # ── Les testeurs ──────────────────────────────────────────────────────────
  #
  # Un seul job pour les deux groupes, parce que le geste est le même : rattacher
  # le build, poser les notes. Ce qui diffère, la revue de bêta, ne concerne que
  # les groupes externes — et le script le déduit du groupe lui-même plutôt que
  # d'un drapeau qu'on pourrait poser à tort.
  #
  # Séparé de la livraison parce qu'il **attend** : Apple met de cinq à trente
  # minutes à traiter un build, et rien ne peut lui être rattaché avant. Un
  # échec ici ne remet pas en cause le build, qui est bien monté — relancer ce
  # seul job suffit.
  # ── La liseuse macOS, sur la machine de l'auteur
  #
  # **Pourquoi pas `macos-15` comme l'iPhone.** L'`actool` de l'image plante en
  # composant `ONT.icon` pour macOS — un plantage sans diagnostic, mesuré en
  # réactivant l'icône dans le job d'épreuves. Et l'image ne propose qu'Xcode
  # 26.3 alors que le workflow demande déjà `latest` : il n'y a pas de version
  # à monter.
  #
  # **Ce que le runner auto-hébergé engage, et ce qui le tient.** Ce dépôt est
  # public. Un runner auto-hébergé y laisserait une proposition venue d'un fork
  # exécuter du code sur la machine — sauf que le dépôt porte
  # `approval_policy: all_external_contributors`, le réglage le plus strict :
  # rien d'extérieur ne s'exécute sans approbation. Reste qu'un runner
  # auto-hébergé est **persistant** là où celui de GitHub est jeté : ce qui
  # tourne laisse des traces. C'est un arbitrage assumé, pas un oubli.
  #
  # Le label `ONTBibleApp` est propre à ce dépôt : les deux autres runners de
  # la machine ne peuvent pas ramasser ce job.
  #
  # Le job **appelle le geste** plutôt que de le réécrire. `livrer-le-mac.sh`
  # doit continuer de marcher à la main le jour où la machine est éteinte, et
  # deux chaînes qui font la même chose finissent par diverger.
  # ## Le Mac est revenu chez GitHub, et pourquoi il en était parti
  #
  # Ce job a tourné une soirée sur un runner **auto-hébergé**, sur la machine
  # de l'auteur. La raison : l'`actool` d'Xcode 26.3 — la seule version que
  # l'image de GitHub propose — plante en composant le bundle Icon Composer
  # pour macOS.
  #
  # Le contournement supposait qu'un Xcode 27 réglerait tout. Il compose bien
  # l'icône, et **Apple refuse ses binaires** : « Apple is not currently
  # accepting applications built with this version of Xcode. » Mesuré à
  # l'envoi, après que l'archive et l'export ont réussi. Les deux issues
  # s'excluaient.
  #
  # La cible macOS porte donc un `.appiconset` classique, gravé depuis le
  # bundle, qu'Xcode 26.3 compose sans broncher — mesuré en CI, qui pose
  # `AppIconMac.icns` dans l'app. Tout ce qui justifiait le runner
  # auto-hébergé a disparu avec ça : plus de machine qui écoute, plus de
  # trousseau à débloquer, plus de bêta refusée.
  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: L'app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ONTBibleApp

      - name: Le vault
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ONTBible/ONTBibleTranslation
          path: ONTBibleTranslation

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest

      - name: La version d'Xcode
        run: xcodebuild -version

      - name: Les outils
        run: brew install xcodegen xcbeautify

      - name: Le corpus et le projet
        working-directory: ONTBibleApp
        run: ONT_VAULT="$GITHUB_WORKSPACE/ONTBibleTranslation" ./scripts/corpus.sh

      # La clé vit le temps du job, dans le dossier que le script attend. Le
      # runner de GitHub est détruit après, donc la reprendre n'est plus
      # indispensable — on la garde parce que ce job a tourné sur une machine
      # personnelle, y retournera peut-être, et qu'un secret qu'on n'efface que
      # lorsque c'est nécessaire finit par rester.
      - name: La clé App Store Connect
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: La livraison
        id: livraison
        working-directory: ONTBibleApp
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          CANAL="${{ inputs.canal || '' }}"
          if [ -z "$CANAL" ]; then
            case "${{ github.ref }}" in
              refs/heads/app-store) CANAL=appstore ;;
              refs/heads/beta-test) CANAL=beta ;;
              *)                  CANAL=interne ;;
            esac
          fi
          case "$CANAL" in
            appstore) GROUPE= ;;
            beta)     GROUPE=Beta ;;
            *)        GROUPE=Dev ;;
          esac
          echo "groupe=$GROUPE" >> "$GITHUB_OUTPUT"
          ./scripts/livrer-le-mac.sh "$CANAL"

      # **TestFlight distribue aussi les apps du Mac**, par l'app TestFlight de
      # macOS. L'achat universel donne une seule entrée App Store Connect pour
      # les deux plateformes — mais « une seule entrée » ne veut pas dire « rien
      # à faire » : la **plateforme macOS doit y être ajoutée à la main**, une
      # fois, avant qu'un build du Mac puisse monter. Tant que ce n'est pas
      # fait, ce job échouera au téléversement, pas ici.
      #
      # D'où `PLATEFORME: MAC_OS` : le numéro de build est daté à la minute et
      # les deux chaînes partent du même push, donc sans ce filtre on attendrait
      # l'iPhone en croyant attendre le Mac, et les deux répondraient `VALID`.
      #
      # Reste une chose que je n'ai pas pu mesurer — la clé de lecture est dans
      # le coffre, son identifiant d'émetteur seulement en secret : je ne sais
      # pas si les groupes de testeurs sont rangés **par plateforme**. `beta.py`
      # ne parie sur aucune des deux réponses ; il refuse s'il trouve deux
      # groupes de même nom, et la première exécution de ce job tranchera.
      - name: Rattacher au groupe TestFlight
        if: steps.livraison.outputs.groupe != ''
        working-directory: ONTBibleApp/.github/scripts
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD: ${{ steps.livraison.outputs.build }}
          GROUPE_BETA: ${{ steps.livraison.outputs.groupe }}
          PLATEFORME: MAC_OS
          NOTES_BETA: ${{ github.event.head_commit.message }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-mac"
          "$RUNNER_TEMP/venv-mac/bin/pip" install --quiet -r exigences.txt
          "$RUNNER_TEMP/venv-mac/bin/python" beta.py

      - name: Reprendre la clé
        if: always()
        run: rm -f ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

  distribuer:
    needs: livrer
    if: needs.livrer.outputs.canal != 'appstore'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Les dépendances
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r .github/scripts/exigences.txt
      - name: Rattacher au groupe, et demander la revue s'il est externe
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD: ${{ needs.livrer.outputs.build }}
          PLATEFORME: IOS
          GROUPE_BETA: ${{ needs.livrer.outputs.groupe }}
          # Ce que les testeurs lisent avant d'installer. Le message entier
          # dépasse ce qu'Apple accepte, et dirait de toute façon à un testeur
          # des choses qui ne s'adressent qu'aux relecteurs du code — le script
          # n'en garde que le sujet.
          NOTES_BETA: ${{ github.event.head_commit.message }}
        run: |
          cd .github/scripts
          "$RUNNER_TEMP/venv/bin/python" beta.py

  # ── La revue de l'App Store ───────────────────────────────────────────────
  soumettre:
    needs: livrer
    if: needs.livrer.outputs.canal == 'appstore'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Les dépendances de soumission
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r .github/scripts/exigences.txt
      - name: Soumettre à la revue
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD: ${{ needs.livrer.outputs.build }}
          PLATEFORME: IOS
          ASC_CONTACT_EMAIL: ${{ secrets.ASC_CONTACT_EMAIL }}
          ASC_CONTACT_TELEPHONE: ${{ secrets.ASC_CONTACT_TELEPHONE }}
        run: |
          cd .github/scripts
          "$RUNNER_TEMP/venv/bin/python" soumettre.py
