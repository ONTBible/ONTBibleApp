name: ONT
options:
  bundleIdPrefix: com.labibleont
  # ## L'app parle français, iOS aussi
  #
  # Sans cette ligne, la région de développement reste l'anglais, et l'app est
  # « non localisée » aux yeux du système. Tous ses propres textes sont écrits
  # en français en dur, donc rien ne le révélait — sauf les textes que le
  # système fournit lui-même. Une recherche sans résultat répondait :
  #
  #     No Results for "zzzzqqqq"
  #     Check the spelling or try a new search.
  #
  # au milieu d'une Bible française. On ne l'a vu qu'en balayant les écrans
  # qu'on n'ouvre presque jamais.
  developmentLanguage: fr
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # L'icône est un bundle Icon Composer (`app/ONT.icon`), pas un
  # `.appiconset`. xcodegen ne sait ni écrire le type `wrapper.icon` ni poser
  # ASSETCATALOG_COMPILER_APPICON_NAME : ce script le fait après chaque
  # génération. En `postGenCommand`, on ne peut pas l'oublier.
  postGenCommand: ../scripts/patch-app-icon.rb

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "N49VNC2G57"
    CODE_SIGN_STYLE: Automatic
    # NON, à contrecœur : le bac à sable interdit à une phase de build de lire
    # $DWARF_DSYM_FOLDER_PATH, qui est hors du répertoire de la cible. C'est
    # exactement ce que fait le téléversement des symboles vers Sentry.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      # L'environnement APNs, substitué dans `ONT.entitlements`.
      #
      # Un jeton obtenu en `development` est refusé par le serveur de
      # production d'Apple, et réciproquement — avec un `BadDeviceToken` qui ne
      # nomme aucune des deux causes. Le figer sur une valeur ferait donc
      # échouer la moitié des envois, selon l'origine du build.
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
      # Sans dSYM, une pile Release arrive en adresses hexadécimales. C'est
      # déjà le défaut d'Xcode en Release ; on l'écrit pour que ça reste vrai.
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.15.0"
  ONTKit:
    path: Packages/ONTKit
  ONTData:
    path: Packages/ONTData
  ONTDesignSystem:
    path: Packages/ONTDesignSystem
  ONTFeatures:
    path: Packages/ONTFeatures

targets:
  ONT:
    type: application
    platform: iOS
    dependencies:
      # Un seul produit Sentry par cible — `Sentry` est le framework
      # statique recommandé, et il inclut les API SwiftUI depuis la 9.4.1.
      - package: Sentry
        product: Sentry
      - package: ONTKit
      - package: ONTData
      - package: ONTDesignSystem
      - package: ONTFeatures
        product: ReadingFeature
      - package: ONTFeatures
        product: LexiconFeature
      - package: ONTFeatures
        product: SearchFeature
      - package: ONTFeatures
        product: QahalFeature
      - package: ONTFeatures
        product: YouFeature
      - target: ONTWidget
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    postBuildScripts:
      # Le dSYM est apparié au binaire par UUID : celui d'un autre build ne
      # symbolise rien. Le téléversement doit donc vivre dans le build qui
      # produit le binaire — pas dans une étape ultérieure qu'on oublierait.
      - name: Symboles de débogage → Sentry
        script: ../scripts/televerser-symboles.sh
        # Sans ça, Xcode saute la phase quand le fichier d'entrée n'a pas
        # bougé — et le premier build après un `sentry-cli login` ne
        # téléverserait rien.
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${EXECUTABLE_NAME}
    info:
      path: Info.plist
      properties:
        # Le rafraîchissement du corpus quand l'app est fermée.
        #
        # Les deux clés vont ensemble et l'oubli de l'une rend l'autre inerte :
        # `UIBackgroundModes` autorise le mode, `BGTaskSchedulerPermittedIdentifiers`
        # dit **quelle** tâche a le droit de s'en servir. Un identifiant absent
        # de cette liste est refusé en silence, des heures après le lancement,
        # dans un processus que personne ne regarde.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.labibleont.ONT.corpus
        # La catégorie de la fiche App Store. « Reference » et non
        # « Book » : la seconde désigne les liseuses de livres achetés, pas une
        # édition consultable.
        LSApplicationCategoryType: public.app-category.reference

        # La déclaration de chiffrement.
        #
        # `false` parce que l'app n'emploie que HTTPS et le trousseau — du
        # chiffrement fourni par le système, exempté par la réglementation
        # américaine. Sans cette clé, App Store Connect pose la question à
        # **chaque** envoi et bloque la distribution tant qu'on n'a pas répondu.
        ITSAppUsesNonExemptEncryption: false

        CFBundleDisplayName: La Bible ONT

        # La version publique — **à monter dès qu'Apple a approuvé la
        # précédente**.
        #
        # Une version approuvée ferme son train de préversions : App Store
        # Connect refuse alors tout nouveau build qui la porte encore, avec
        # « Invalid Pre-Release Train … is closed for new build submissions ».
        # La compilation réussit, l'archive se signe, et c'est le téléversement
        # qui casse — donc l'échec arrive tard, une fois tout payé, et il se
        # répète à chaque fusion vers `dev` tant que ce nombre n'a pas bougé.
        # C'est ce qui a bloqué TestFlight du 24 au 25 août 2026 : 1.0.3 avait
        # été approuvée, et cinq livraisons de suite sont mortes ici.
        #
        # **Deuxième fois le 30 août 2026**, 1.0.4 approuvée à son tour. Deux
        # occurrences en six jours disent que ce n'est pas un oubli isolé mais
        # un rythme : l'approbation arrive sans prévenir, et rien dans le dépôt
        # ne l'apprend — c'est l'auteur qui la voit dans App Store Connect et
        # doit y penser. Le geste reste manuel à dessein, puisqu'il engage le
        # numéro que le public verra ; ce qui manque est un **rappel**, pas une
        # automatisation.
        #
        # Le numéro de build, lui, n'a pas ce problème : il est daté et croît
        # tout seul (voir l'en-tête de `.github/workflows/livraison.yml`).
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "1"
        # Sans cette clé, iOS lance l'app en mode compatibilité letterboxé.
        # Le dictionnaire vide suffit : il déclare une scène de lancement
        # moderne, pleine dalle.
        # **La nuit, et non le noir du système.**
        #
        # Le dictionnaire vide déclarait une scène de lancement moderne, pleine
        # dalle — nécessaire, sinon iOS letterboxe l'app —, mais il laissait le
        # fond au système : noir franc en apparence sombre.
        #
        # Or l'app met deux secondes et demie à charger son corpus, et le
        # lecteur regardait ce noir avant que l'ouverture ne commence. Le
        # raccorder à la nuit de l'ouverture fait de cette attente le début du
        # mouvement plutôt qu'une salle vide qui le précède.
        #
        # `NuitDeLOuverture` est un peu plus sombre que ``ONTColors/nuit`` :
        # c'est la teinte du **bord** du dégradé, celle qui touche les bords de
        # l'écran, donc celle qui doit se raccorder sans couture.
        UILaunchScreen:
          UIColorName: NuitDeLOuverture
        # L'iPhone n'a pas d'upside-down, et c'est l'usage : personne ne tient
        # un téléphone à l'envers, et le laisser tourner ferait basculer la
        # page pour rien.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # L'iPad, lui, exige les **quatre**. Ce n'est pas un goût : le
        # multitâche pose deux apps côte à côte, et le système doit pouvoir
        # tourner la scène sans demander à chacune si elle veut bien. Une app
        # qui n'en déclare que trois est refusée à la validation, pas au build —
        # donc après signature et téléversement, au dernier moment.
        #
        # Et sur un iPad, « à l'envers » ne veut rien dire : aucune arête n'est
        # le bas, on le pose comme on veut.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Ezra SIL (OFL) porte le niqqud et les te'amim, et les positionne —
        # c'est la fonte de référence pour l'hébreu biblique. SBL Hebrew et
        # Taamey Frank CLM restent hors de l'app : licences incompatibles avec
        # une redistribution binaire. Frank Ruhl Libre tient les titres.
        #
        # Puis six familles de corps, toutes OFL, chacune en trois coupes —
        # romaine, italique, semi-grasse. Le lecteur choisit ; Literata est le
        # défaut. Georgia n'est pas listée : Apple la livre avec le système.
        #
        # Les coupes sont figées à opsz 14 (la taille de lecture visée) et
        # élaguées aux écritures utiles — latin, grec, diacritiques,
        # ponctuation. 8,1 Mo de sources deviennent 2,9 Mo embarqués.
        UIAppFonts:
          - EzraSIL.ttf
          - FrankRuhlLibre-Medium.ttf
          - Literata-Regular.ttf
          - Literata-Italic.ttf
          - Literata-SemiBold.ttf
          - EBGaramond-Regular.ttf
          - EBGaramond-Italic.ttf
          - EBGaramond-SemiBold.ttf
          - Spectral-Regular.ttf
          - Spectral-Italic.ttf
          - Spectral-SemiBold.ttf
          - SourceSerif4-Regular.ttf
          - SourceSerif4-Italic.ttf
          - SourceSerif4-SemiBold.ttf
          - Newsreader-Regular.ttf
          - Newsreader-Italic.ttf
          - Newsreader-SemiBold.ttf
          - Jost-Regular.ttf
          - Jost-Italic.ttf
          - Jost-SemiBold.ttf
        # Schéma interne : toucher un intraduisible ouvre sa fiche de lexique.
        # L'adresse du backend. Les identifiants clients ci-dessous sont
        # publics par nature (ils voyagent dans l'URL d'autorisation) ; les
        # *secrets*, eux, ne quittent jamais la Lambda.
        ONTAPIBaseURL: https://j451hq8d3k.execute-api.eu-west-3.amazonaws.com
        # L'adresse publique des liens partagés. Tant qu'elle est absente,
        # l'app partage sans lien plutôt qu'avec une adresse morte.
        ONTWebBaseURL: https://ontbible.com
        ONTSentryDSN: "https://16810c8790d47c067a9df70b99059ebe@o4511490425159680.ingest.de.sentry.io/4511893874278480"
        ONTGoogleClientID: "154337904456-de9o2u3res51203irei6o0ggk1lvlkq5.apps.googleusercontent.com"
        ONTGitHubClientID: "Ov23liKe17kibtPWeUE1"
        CFBundleURLTypes:
          - CFBundleURLName: com.labibleont.ONT.term
            CFBundleURLSchemes:
              - ont
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labibleont.ONT
        GENERATE_INFOPLIST_FILE: NO
        # Sign in with Apple. Tant que DEVELOPMENT_TEAM est vide, la
        # compilation passe mais l'autorisation n'est pas signée : la
        # connexion Apple échouera sur un appareil réel.
        CODE_SIGN_ENTITLEMENTS: ONT.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  ONTWidget:
    type: app-extension
    platform: iOS
    # Le vivier et deux coupes de Literata sont recopiés ici plutôt que
    # partagés : une extension ne lit pas le bundle de l'app qui la contient.
    # 125 Ko + 360 Ko dupliqués, contre un groupe d'app à configurer et une
    # capacité de plus sur l'App ID.
    sources:
      - path: Widget
      - path: Widget/Resources
        buildPhase: resources
    dependencies:
      - package: ONTKit
      - package: ONTData
      - package: ONTDesignSystem
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Verset du jour
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "1"
        UIAppFonts:
          - Literata-Regular.ttf
          - Literata-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labibleont.ONT.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # La liseuse du Mac.
  #
  # ## Pourquoi une cible native, et pas Catalyst
  #
  # Catalyst rendrait l'app iOS dans une fenêtre, avec ses gestes, ses marges
  # de pouce et sa barre d'onglets en bas — une app iPad posée sur un bureau.
  # C'est précisément ce qu'on ne veut pas ici, puisqu'elle s'ouvrira à côté
  # d'un éditeur pour relire ce qu'on vient d'écrire.
  #
  # Une cible native partage les quatre paquets — donc le corpus, les thèmes,
  # le moteur de rendu et les seuils de contraste — et ne diverge que là où le
  # Mac est vraiment différent.
  #
  # ## Ce qu'elle n'emporte pas, et pourquoi
  #
  # **Pas de widget** : le Mac n'a pas d'écran d'accueil au sens d'iOS.
  # **Pas de tâche de fond** : `BGTaskScheduler` n'existe pas ici ; la mise à
  # jour du corpus se fait à l'ouverture et sur demande, ce qui suffit à une
  # machine qu'on n'éteint pas.
  # **Pas de Sentry** : on n'instrumente pas une liseuse avant qu'elle ait un
  # seul lecteur.
  ONTMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    dependencies:
      - package: ONTKit
      - package: ONTData
      - package: ONTDesignSystem
      - package: ONTFeatures
        product: ReadingFeature
      - package: ONTFeatures
        product: LexiconFeature
      - package: ONTFeatures
        product: SearchFeature
      - package: ONTFeatures
        product: QahalFeature
      - package: ONTFeatures
        product: YouFeature
    sources:
      - path: Sources
        excludes:
          # Trois fichiers d'iOS, relevés et non devinés — les seuls de
          # `Sources/` qui importent UIKit ou Sentry.
          #
          # `ONTApp` déclare des tâches de fond et une barre d'onglets ; le Mac
          # a son propre point d'entrée, dans `MacSources`.
          - "App/ONTApp.swift"
          # Sentry n'est pas lié à cette cible : on n'instrumente pas une
          # liseuse avant qu'elle ait un seul lecteur.
          - "App/Observability.swift"
          # **La racine d'iOS.** Le Mac a la sienne, `MacSources/RacineMac.swift`,
          # et ce n'est pas une duplication : `RootView` monte une
          # `TabView(.sidebarAdaptable)` dont AppKit dessine la barre latérale —
          # sa teinte, sa taille de texte et sa largeur échappent alors à l'app.
          # Le contenu, lui, reste partagé : ce sont les mêmes onglets.
          - "App/RootView.swift"
      - path: MacSources
      - path: Resources
        buildPhase: resources
    info:
      path: Info-Mac.plist
      properties:
        LSApplicationCategoryType: public.app-category.reference
        ITSAppUsesNonExemptEncryption: false
        # **Les fontes, qui n'étaient inscrites nulle part sur le Mac.**
        #
        # iOS les déclare par `UIAppFonts`. macOS ne connaît pas cette clé : il
        # lit `ATSApplicationFontsPath`, un chemin relatif à `Resources/`. La
        # cible ne déclarait ni l'une ni l'autre — les `.ttf` étaient copiés
        # dans le bundle, et personne ne les inscrivait.
        #
        # Le défaut était invisible ici et seulement ici : `Font.custom`
        # retombe en silence sur la fonte système, et l'auteur a Ezra SIL
        # installée à titre personnel — `~/Library/Fonts/SILEOT.ttf`. L'hébreu
        # s'affichait donc correctement **sur sa machine et sur aucune autre**,
        # pendant que Literata, elle, ne s'affichait nulle part.
        #
        # « . » et non « Fonts » : la phase de ressources aplatit
        # `Resources/Fonts/` dans `Contents/Resources/`.
        ATSApplicationFontsPath: "."

        # **`CFBundleName` en plus de `CFBundleDisplayName`.**
        #
        # Le Mac prend son nom de menu dans `CFBundleName`, qui retombe sur le
        # nom de la cible quand il manque : la barre affichait « ONTMac ».
        # `CFBundleDisplayName` ne sert qu'au Finder et au Dock, où le nom était
        # juste — d'où un défaut visible partout sauf là où on l'avait vérifié.
        CFBundleName: La Bible ONT
        CFBundleDisplayName: La Bible ONT
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "1"
        # Le même contrat de lien public que sur iOS.
        ONTWebBaseURL: https://ontbible.com
        # **Le schéma interne, qu'il manquait ici.**
        #
        # `RacineMac` appelle `onOpenURL` et `Router.open` depuis le premier
        # jour, mais rien ne déclarait `ont://` au système : le Mac répondait
        # « aucune application ne sait ouvrir cette adresse ». Le code était
        # prêt, la déclaration non — et rien ne pouvait le dire, puisque le
        # défaut est dans un fichier que le compilateur ne lit pas.
        CFBundleURLTypes:
          - CFBundleURLName: com.labibleont.ONT.mac.term
            CFBundleURLSchemes:
              - ont
    settings:
      base:
        # **Le même identifiant que l'iOS, et c'est délibéré.**
        #
        # C'est l'achat universel d'Apple : une seule fiche à l'App Store, une
        # seule revue, et le lecteur qui a l'app sur iPhone a celle du Mac.
        #
        # Ce n'est pas qu'une commodité de distribution. Sign in with Apple
        # délivre son code **au bundle qui l'a demandé**, et le backend n'échange
        # que les codes émis pour `com.labibleont.ONT`. Sous `…ONT.mac`, Apple
        # aurait refusé l'échange même avec le droit posé — il aurait fallu un
        # App ID de plus, groupé chez Apple, et une troisième origine côté
        # serveur. Beaucoup d'ouvrage pour une fiche séparée dont une liseuse
        # gratuite n'a que faire.
        PRODUCT_BUNDLE_IDENTIFIER: com.labibleont.ONT
        # Les droits du Mac — voir `ONTMac.entitlements`. Sans eux, la connexion
        # Apple échoue avant de partir.
        CODE_SIGN_ENTITLEMENTS: ONTMac.entitlements
        # **Le nom du bundle sur le disque**, et donc celui que le Dock montre
        # dans son infobulle. `CFBundleName` ne suffisait pas : il nomme les
        # menus, pas le fichier — l'app s'appelait « La Bible ONT » partout sauf
        # au survol de son icône, où elle restait « ONTMac ».
        #
        # Un troisième endroit, après la barre des menus et le Finder, où le
        # même nom se déclare autrement. C'est ce qui rend ce genre de défaut
        # tenace : on en corrige un, on croit avoir fini.
        # **L'accent de la marque, lu par AppKit et non par SwiftUI.**
        #
        # `.tint()` teinte ce que SwiftUI dessine. La barre latérale d'un
        # `TabView(.sidebarAdaptable)` est dessinée par AppKit, qui ne le lit
        # pas : sa sélection restait au rose vif des Réglages du lecteur, sur
        # une peau or et bordeaux.
        #
        # `AccentColor` dans le catalogue est le seul endroit qu'AppKit
        # consulte. L'or profond le jour, l'or clair la nuit — les deux valeurs
        # de `ONTColors.accent`, recopiées ici parce qu'un catalogue ne sait pas
        # appeler du Swift.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: La Bible ONT
        # Le nom du **module**, que `PRODUCT_NAME` entraînerait sinon :
        # « La Bible ONT » devient `La_Bible_ONT`, et les épreuves qui
        # écrivent `@testable import ONTMac` ne le trouvent plus. Le nom
        # affiché et le nom de code n'ont aucune raison d'être le même.
        PRODUCT_MODULE_NAME: ONTMac
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES

  # Les épreuves de ce qui n'existe que sur le Mac.
  ONTMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: MacTests
    dependencies:
      - target: ONTMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # **L'hôte se nomme par son `PRODUCT_NAME`, pas par sa cible.**
        #
        # XcodeGen déduit `TEST_HOST` du nom de la cible — « ONTMac.app » —, or
        # le produit s'appelle « La Bible ONT.app » depuis qu'on l'a renommé
        # pour le Dock. Le chemin pointait donc sur une app qui n'existe pas, et
        # `xcodebuild test` refusait de démarrer.
        #
        # Conséquence qu'on n'avait pas vue : les épreuves du Mac n'ont jamais
        # tourné. Elles étaient écrites, compilées, et injoignables.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/La Bible ONT.app/Contents/MacOS/La Bible ONT"
        BUNDLE_LOADER: "$(TEST_HOST)"

  ONTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ONT
      - package: ONTKit
      - package: ONTData
      - package: ONTDesignSystem
      - package: ONTFeatures
        product: ReadingFeature
      - package: ONTFeatures
        product: YouFeature
      - package: ONTFeatures
        product: QahalFeature
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ONT.app/ONT"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # La cible d'app fournit le sien (`Info.plist`), pas celle-ci : sans
        # ce drapeau, la signature du bundle de tests échoue faute de plist.
        GENERATE_INFOPLIST_FILE: YES

  ONTUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ONT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Le schéma des tests d'interface est **séparé**, et volontairement hors CI.
  #
  # Ils lancent l'app, font des gestes et attendent : quelques minutes chacun,
  # et une fragilité qui n'a rien à voir avec le code qu'on relit. Les mêler
  # aux tests unitaires ferait payer ce prix à chaque relecture de PR.
  #
  #   xcodebuild test -scheme ONTUITests -destination 'id=<simulateur>'
  ONTUITests:
    build:
      targets:
        ONT: all
        ONTUITests: [test]
    test:
      config: Debug
      targets:
        - ONTUITests

  ONT:
    build:
      targets:
        ONT: all
        ONTWidget: all
        ONTTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ONTTests

  # Le Mac, avec ses épreuves.
  #
  # Sans ce schéma, `xcodebuild test -scheme ONTMac` répond « not currently
  # configured for the test action » : la cible d'épreuves existait, rien ne la
  # rattachait. Des tests qu'aucune commande ne lance sont des tests qui
  # n'existent pas.
  ONTMac:
    build:
      targets:
        ONTMac: all
        ONTMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ONTMacTests
