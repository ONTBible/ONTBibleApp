# Le confort de build.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX, et rien d'autre — les vieilles bibliothèques de support n'ont plus
# cours et leur cohabitation est la première source de conflits de classes.
android.useAndroidX=true

# Kotlin officiel pour le style de code : les fichiers engendrés le suivent
# déjà, et deux styles dans un même dépôt finissent par se disputer en revue.
kotlin.code.style=official
